<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#131315" />
    <title>Vellum</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div class="workbench" id="workbench">
      <!-- 顶栏：融入画布，不再是圆角岛 -->
      <header class="topbar" id="topbar">
        <div class="brand" id="brand" title="Vellum">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M6 3.5h8.2L19 8.3V20.5H6z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
            <path d="M14 3.6V8.4h4.6" fill="none" stroke="currentColor" stroke-width="1.2" />
            <path d="M9 12h7M9 15.5h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
          <span class="brand-name" id="titleText">Vellum</span>
          <span class="dirty-dot" id="dirtyDot" hidden></span>
        </div>

        <div class="top-actions">
          <button class="btn btn-ghost icon-only" id="findBtn" data-i18n-title="action.find" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button class="btn btn-ghost" id="formatBtn" data-i18n="action.format" disabled></button>
          <button class="btn btn-primary" id="saveBtn" data-i18n="action.save" disabled></button>

          <div class="seg" id="engineSeg" role="group" data-i18n-title="action.engine">
            <button class="seg-item is-active" data-engine="cm" aria-label="CodeMirror"></button>
            <button class="seg-item" data-engine="monaco" aria-label="Monaco"></button>
          </div>

          <button class="btn btn-ghost" id="langBtn" title="Language">中</button>
          <button class="btn btn-ghost icon-only" id="themeBtn" data-i18n-title="action.theme">
            <svg class="theme-icon-sun" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path
                d="M10 2.3v2.1M10 15.6v2.1M2.3 10h2.1M15.6 10h2.1M4.6 4.6l1.5 1.5M13.9 13.9l1.5 1.5M15.4 4.6l-1.5 1.5M6.1 13.9l-1.5 1.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
            <svg class="theme-icon-moon" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M13.9 12.6A5.7 5.7 0 0 1 7.4 6.1a5.7 5.7 0 1 0 6.5 6.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="btn btn-ghost icon-only" id="helpBtn" data-i18n-title="action.help">?</button>
          <button class="btn btn-ghost icon-only" id="moreBtn" data-i18n-title="action.more">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="5" cy="10" r="1.4" fill="currentColor" />
              <circle cx="10" cy="10" r="1.4" fill="currentColor" />
              <circle cx="15" cy="10" r="1.4" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <!-- 主体 -->
      <div class="body" id="body">
        <!--
          左侧 = 图标栏 + 面板岛，与右侧同构：
          图标栏没有岛背景，只放按钮；面板是独立岛屿，展开就把编辑区挤窄。
          没有悬停浮出，开合全部走显式点击。
        -->
        <nav class="rail rail-left" id="leftBar">
          <button
            class="rail-btn"
            id="railFilesBtn"
            data-left-tab="files"
            aria-pressed="true"
            aria-expanded="true"
            aria-controls="drawer"
            data-i18n-title="rail.files"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M2.6 6.2h5.1l1.6 2h8.1v7.4a1.4 1.4 0 0 1-1.4 1.4H4a1.4 1.4 0 0 1-1.4-1.4z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
              <path
                d="M2.6 8.2V5.4A1.4 1.4 0 0 1 4 4h3.1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
            </svg>
            <span class="rail-badge" id="railFilesCount">0</span>
          </button>
          <button
            class="rail-btn"
            id="railSearchBtn"
            data-left-tab="search"
            aria-pressed="false"
            aria-expanded="true"
            aria-controls="drawer"
            data-i18n-title="rail.search"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path d="M12.8 12.8 16.6 16.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button
            class="rail-btn"
            id="railTrashBtn"
            data-left-tab="trash"
            aria-pressed="false"
            aria-expanded="true"
            aria-controls="drawer"
            data-i18n-title="rail.trash"
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M4.2 6.2h11.6M8.1 6.2V4.4h3.8v1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M5.6 6.2l.7 9a1.3 1.3 0 0 0 1.3 1.2h4.8a1.3 1.3 0 0 0 1.3-1.2l.7-9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
              <path
                d="M8.6 9v4.4M11.4 9v4.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.2"
                stroke-linecap="round"
              />
            </svg>
            <span class="rail-badge" id="railTrashCount">0</span>
          </button>
          <button
            class="rail-btn"
            id="railSnapshotsBtn"
            data-left-tab="snapshots"
            aria-pressed="false"
            aria-expanded="true"
            aria-controls="drawer"
            data-i18n-title="rail.snapshots"
          >
            <!-- 叠层 = 历史版本：比相机更贴近「快照」在这里的真实含义 -->
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M10 3.4 3.4 6.8l6.6 3.4 6.6-3.4z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
              <path
                d="M3.4 10.2 10 13.6l6.6-3.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3.4 13.6 10 17l6.6-3.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <span class="rail-grow"></span>
          <!-- 库内占用环：纯指示，不可点；精确数字在文件页底部 -->
          <div class="rail-disk" id="railDisk" aria-hidden="true">
            <svg viewBox="0 0 36 36">
              <circle class="ring-track" cx="18" cy="18" r="15" />
              <circle class="ring-fill" id="railDiskRing" cx="18" cy="18" r="15" />
            </svg>
          </div>
        </nav>

        <!-- 左侧面板岛：默认展开 files 分区；宽度由 --drawer-w 控制 -->
        <aside
          class="island drawer"
          id="drawer"
          data-state="open"
          role="region"
          aria-labelledby="drawerTitle"
          aria-hidden="false"
        >
          <!-- 内容宽度锁在 --drawer-w 上：开合动画只改外层宽度，树行不跟着每帧重排 -->
          <div class="drawer-inner">
            <div class="drawer-head">
              <h2 class="drawer-title" id="drawerTitle"></h2>
              <button
                class="btn btn-ghost icon-only drawer-close"
                id="drawerClose"
                data-i18n-title="drawer.close"
              >
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path
                    d="M5.6 5.6l8.8 8.8M14.4 5.6l-8.8 8.8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
            <div class="drawer-actions" id="drawerActions">
              <button class="btn" id="newFileBtn" data-i18n="action.newFile"></button>
              <button class="btn" id="newFolderBtn" data-i18n="action.newFolder"></button>
            </div>
            <!-- 搜索分区：文件名搜索 + 可选的设置（内容 / 大文件）；文件页不再带搜索框 -->
            <div class="drawer-searchpane" id="searchPane" hidden>
              <div class="drawer-search">
                <!-- 调整图标：两个开关都收进弹层，默认关闭，不占搜索行的地方 -->
                <button
                  class="search-optbtn"
                  id="searchOptionsBtn"
                  aria-haspopup="true"
                  aria-expanded="false"
                  aria-controls="searchOptions"
                  data-i18n-title="search.options"
                >
                  <svg viewBox="0 0 20 20" aria-hidden="true">
                    <path
                      d="M3 6.5h8.2M15.4 6.5h1.6M3 13.5h3.2M10.4 13.5h6.6"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.3"
                      stroke-linecap="round"
                    />
                    <circle cx="13.4" cy="6.5" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3" />
                    <circle cx="8.3" cy="13.5" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3" />
                  </svg>
                </button>
                <div class="search-field">
                  <input
                    id="searchInput"
                    type="text"
                    spellcheck="false"
                    autocomplete="off"
                    data-i18n-placeholder="search.placeholder"
                  />
                  <button class="search-clear" id="searchClear" hidden data-i18n-title="drawer.clearSearch">
                    <svg viewBox="0 0 20 20" aria-hidden="true">
                      <path
                        d="M6.4 6.4l7.2 7.2M13.6 6.4l-7.2 7.2"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                      />
                    </svg>
                  </button>
                </div>
                <!-- 任一项设置打开才出现：那时不再边打字边搜，交给用户自己按 -->
                <button class="search-go" id="searchGo" hidden data-i18n-title="search.start">
                  <svg viewBox="0 0 20 20" aria-hidden="true">
                    <circle cx="8.7" cy="8.7" r="5" fill="none" stroke="currentColor" stroke-width="1.5" />
                    <path
                      d="M12.5 12.5l3.8 3.8"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
              </div>
              <div class="search-options" id="searchOptions" hidden>
                <label class="search-opt">
                  <input type="checkbox" id="searchDeep" />
                  <span class="search-opt-text">
                    <span data-i18n="search.deep"></span>
                    <em data-i18n="search.deepHint"></em>
                  </span>
                </label>
                <label class="search-opt">
                  <input type="checkbox" id="searchBig" />
                  <span class="search-opt-text">
                    <span data-i18n="search.big"></span>
                    <em data-i18n="search.bigHint"></em>
                  </span>
                </label>
                <div class="search-opt-note" data-i18n="search.optNote"></div>
              </div>
              <div class="drawer-list" id="searchResults"></div>
            </div>
            <div class="drawer-list" id="drawerList"></div>
            <!-- 文件页底部的占比：环给直觉，这里给精确数字 -->
            <div class="drawer-storage" id="drawerStorage" hidden>
              <div class="storage-meter"><span class="storage-fill" id="storageFill"></span></div>
              <div class="storage-text" id="drawerStorageText"></div>
            </div>
            <div class="drawer-foot" id="drawerFoot">
              <button class="btn" id="restoreAllBtn" data-i18n="action.restoreAll" hidden></button>
              <button class="btn" id="emptyTrashBtn" data-i18n="action.emptyTrash" hidden></button>
              <button class="btn btn-primary" id="importBtn" data-i18n="action.import"></button>
              <div class="batch-bar" id="batchBar" hidden>
                <span class="batch-count" id="batchCount"></span>
                <button class="btn" id="batchExportBtn" data-i18n="action.batchExport"></button>
                <button class="btn" id="batchMoveBtn" data-i18n="action.batchMove"></button>
                <button class="btn" id="batchCleanBtn" data-i18n="action.batchClean"></button>
                <button class="btn" id="batchTrashBtn" data-i18n="action.batchTrash"></button>
                <button class="btn btn-ghost" id="batchClearBtn" data-i18n="action.batchClear"></button>
              </div>
            </div>
          </div>
          <!-- 拖右缘调宽度：层级深的目录树靠它撑开；双击还原 -->
          <div
            class="drawer-resizer"
            id="drawerResizer"
            role="separator"
            aria-orientation="vertical"
            tabindex="0"
            data-i18n-title="drawer.resize"
          ></div>
        </aside>

        <!-- 编辑器岛屿 -->
        <main class="island editor-island" id="editorIsland">
          <div class="editor-host" id="editorHost"></div>

          <!-- 查找 / 替换：两个引擎共用，浮在编辑区右上角 -->
          <div class="findbar" id="findBar" hidden>
            <div class="findbar-row">
              <input
                id="findInput"
                type="text"
                spellcheck="false"
                autocomplete="off"
                data-i18n-placeholder="find.placeholder"
              />
              <span class="find-count" id="findCount">0 / 0</span>
              <button class="fb-btn" id="findPrev" data-i18n-title="find.prev">↑</button>
              <button class="fb-btn" id="findNext" data-i18n-title="find.next">↓</button>
              <button class="fb-btn" id="findCase" data-i18n-title="find.case">Aa</button>
              <button class="fb-btn" id="findWord" data-i18n-title="find.word">ab</button>
              <button class="fb-btn" id="findRegex" data-i18n-title="find.regex">.*</button>
              <button class="fb-btn" id="findReplaceToggle" data-i18n-title="find.toggleReplace">⇄</button>
              <button class="fb-btn fb-close" id="findClose" data-i18n-title="action.close">×</button>
            </div>
            <div class="findbar-row" id="findReplaceRow" hidden>
              <input
                id="replaceInput"
                type="text"
                spellcheck="false"
                autocomplete="off"
                data-i18n-placeholder="find.replacePlaceholder"
              />
              <button class="fb-btn fb-text" id="findReplaceOne" data-i18n="find.replace"></button>
              <button class="fb-btn fb-text" id="findReplaceAll" data-i18n="find.replaceAll"></button>
            </div>
          </div>

          <div class="empty-state" id="emptyState">
            <div class="empty-card">
              <svg class="empty-icon" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M13 7h14l8 8v26H13z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <path d="M27 7.4V15h7.6" fill="none" stroke="currentColor" stroke-width="1.4" />
                <path d="M24 22v12M19.5 29.5 24 34l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <h1 data-i18n="empty.title"></h1>
              <p data-i18n="empty.hint"></p>
              <div class="empty-actions">
                <button class="btn btn-primary" id="emptyPickBtn" data-i18n="action.pick"></button>
                <button class="btn btn-ghost" id="emptyPasteBtn" data-i18n="action.paste"></button>
              </div>
              <p class="empty-privacy" data-i18n="empty.privacy"></p>
            </div>
          </div>
        </main>

        <!-- 右侧预览（停靠，位于编辑区与右竖条之间） -->
        <aside class="island panel-right" id="rightPanel">
          <div
            class="panel-resizer"
            id="panelResizer"
            role="separator"
            aria-orientation="vertical"
            data-i18n-title="panel.resize"
            tabindex="0"
          ></div>
          <div class="panel-head">
            <div class="panel-tabs" role="tablist">
              <button class="panel-tab is-active" id="panelTabPreview" role="tab" data-i18n="panel.preview"></button>
              <button class="panel-tab" id="panelTabOutline" role="tab" data-i18n="panel.outline"></button>
            </div>
            <div class="spacer"></div>
            <button class="btn btn-ghost icon-only" id="previewPrint" data-i18n-title="action.print">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M6.4 6.8V3.6h7.2v3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
                <path
                  d="M6.4 14.4H4.6A1.4 1.4 0 0 1 3.2 13V9.2a1.6 1.6 0 0 1 1.6-1.6h10.4a1.6 1.6 0 0 1 1.6 1.6V13a1.4 1.4 0 0 1-1.4 1.4h-1.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                  stroke-linejoin="round"
                />
                <rect x="6.4" y="11.4" width="7.2" height="5.2" rx="0.9" fill="none" stroke="currentColor" stroke-width="1.3" />
              </svg>
            </button>
            <button class="btn btn-ghost icon-only" id="previewClose" data-i18n-title="action.close">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M5.6 5.6l8.8 8.8M14.4 5.6l-8.8 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div class="markdown-body" id="previewBody"></div>
          <div class="outline-body" id="outlineBody" hidden></div>
        </aside>

        <!-- 右竖条 -->
        <aside class="rail rail-right">
          <button class="rail-btn" id="previewBtn" data-i18n-title="rail.preview" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M2.4 10S5.4 4.8 10 4.8 17.6 10 17.6 10 14.6 15.2 10 15.2 2.4 10 2.4 10z" fill="none" stroke="currentColor" stroke-width="1.3" />
              <circle cx="10" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <button class="rail-btn" id="outlineBtn" data-i18n-title="rail.outline" data-doc-action hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3.4 5.2h1.2M7 5.2h9.6M3.4 10h1.2M7 10h9.6M3.4 14.8h1.2M7 14.8h9.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
            </svg>
          </button>
          <button
            class="rail-btn"
            id="transformsBtn"
            data-doc-action
            data-i18n-title="rail.transforms"
            hidden
          >
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M3.2 5.4h7.4M3.2 10h5.2M3.2 14.6h7.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
              <path
                d="M14.8 4.6v10.8M12.6 6.8l2.2-2.2 2.2 2.2M17 13.2l-2.2 2.2-2.2-2.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="rail-btn" id="statsBtn" data-doc-action data-i18n-title="rail.stats" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path
                d="M10 9.1v4.4M10 6.6v.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button class="rail-btn" id="diffBtn" data-doc-action data-i18n-title="rail.diff" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10.2" r="6.4" fill="none" stroke="currentColor" stroke-width="1.3" />
              <path
                d="M10 6.4v4l2.8 1.7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="rail-btn" id="diffFileBtn" data-doc-action data-i18n-title="rail.diffFile" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect
                x="3.2"
                y="5.6"
                width="9.2"
                height="9.2"
                rx="1.3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              />
              <path
                d="M7.2 5.6v-.9c0-.7.6-1.3 1.3-1.3h6.4c.7 0 1.3.6 1.3 1.3v6.4c0 .7-.6 1.3-1.3 1.3h-.9"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="rail-btn" id="toolsBtn" data-i18n-title="rail.tools">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M12.8 3.4a4 4 0 0 0-4.6 5.4l-4.4 4.4a1.6 1.6 0 0 0 2.2 2.2l4.4-4.4a4 4 0 0 0 5.4-4.6l-2.3 2.3-2.3-.4-.4-2.3z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            </svg>
          </button>
        </aside>


      </div>

      <!-- 状态栏：同样融入画布，只留边距 -->
      <footer class="statusbar" id="statusbar">
        <span class="st" id="stCursor">—</span>
        <span class="st-sep"></span>
        <span class="st clickable" id="stLang" title="Syntax highlighting">—</span>
        <span class="st-sep"></span>
        <span class="st clickable" id="stEncoding">UTF-8</span>
        <span class="st-sep"></span>
        <span class="st clickable" id="stEol">LF</span>
        <span class="st-sep"></span>
        <span class="st" id="stCount"></span>
        <span class="spacer"></span>
        <span class="st" id="stSaved" hidden></span>
        <span class="st-sep"></span>
        <span class="st" id="stCache"></span>
        <span class="st-sep"></span>
        <span class="st st-engine" id="stEngine"></span>
        <span class="st-badge clickable" id="stHighlight" hidden></span>
        <span class="st-badge" id="stLight" hidden data-i18n="status.light"></span>
        <span class="st-badge" id="stReadonly" hidden></span>
      </footer>
    </div>

    <input type="file" id="filePicker" hidden />
    <div class="drop-overlay" id="dropOverlay" hidden>
      <div class="drop-card" data-i18n="empty.drop"></div>
    </div>
    <div class="toasts" id="toasts"></div>
    <div class="dialog-layer" id="dialogLayer" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
